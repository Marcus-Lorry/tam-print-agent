name: build-agent
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pywin32 pyinstaller
      - run: python agent.py --selftest
      - run: pyinstaller --onefile --noconsole --name print-agent agent.py
      - uses: actions/upload-artifact@v4
        with:
          name: print-agent-exe
          path: dist/print-agent.exe
